name: PVR observation - Android15 6.6.127

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      pvr_observe:
        description: "Include default-off bridge observer; build only, never flash"
        required: false
        type: boolean
        default: false

jobs:
  build-observation:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      pvr_observe: ${{ inputs.pvr_observe }}
      android_version: android15
      kernel_version: "6.6"
      sub_level: "127"
      os_patch_level: "2026-04"
      ksu_variant: ReSukiSU
      ksu_mode: 关闭
      version: hachimidingdongjiccb
      revision: r1
      build_time: "N"
      use_zram: false
      use_bbg: false
      use_kpm: "disabled (关闭)"
      use_rekernel: false
      use_nomount: false
      use_networking: true
      cve_2026_43499_patch: false
      export_susfs_patches: false
      enable_susfs: true
      supp_op: false
      droidspaces: "678"
      droidspaces_ntsync: true
      artifact_upload_mode: "仅上传 AnyKernel3.zip"
